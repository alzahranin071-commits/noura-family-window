<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!-- نافذة الأسرة | إعداد وإشراف: أ. نوره سعد الزهراني — الابتدائية الحادية والخمسون. جميع الحقوق محفوظة. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نافذة الأسرة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'sha256-OYAbhPUsOryfaVKrvKy2SKzk9/A4IE0QqX8uGp/vxYM='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="author" content="أ. نوره سعد الزهراني">
<meta name="copyright" content="جميع الحقوق محفوظة لـ أ. نوره سعد الزهراني">
<meta name="description" content="نافذة الأسرة: مرجع تفاعلي لأولياء أمور الطالبات ذوات صعوبات التعلم - الابتدائية الحادية والخمسون">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: a calm "window" — sticky pill nav, one section shown at a time, rounded cards on a lavender-white ground. */
:root{
  --h-mauve:#a98bd6; --h-rose:#eba6bd; --h-sky:#87cbe6;
  --bg:#fbf8fe; --surface:#ffffff; --ink:#2b2340; --muted:#665c7c; --line:#e7dff2;
  --accent:color-mix(in srgb, var(--h-mauve) 58%, #24163f);
  --accent-soft:color-mix(in srgb, var(--h-mauve) 17%, var(--surface));
  --mauve-tint:color-mix(in srgb, var(--h-mauve) 30%, var(--surface));
  --rose-ink:color-mix(in srgb, var(--h-rose) 50%, #4d1229);
  --rose-soft:color-mix(in srgb, var(--h-rose) 22%, var(--surface));
  --sky-ink:color-mix(in srgb, var(--h-sky) 45%, #0b3245);
  --sky-soft:color-mix(in srgb, var(--h-sky) 22%, var(--surface));
  --amber:#e7b45a; --amber-soft:color-mix(in srgb, #e7b45a 22%, var(--surface));
  --on-accent:#ffffff;
  --ok:#2c825a; --ok-soft:#e2f3e9; --no:#b0445d; --no-soft:#fbe6ec;
  --shadow:0 1px 2px rgb(60 40 90 / .05), 0 10px 28px rgb(60 40 90 / .09);
  --font-body:"Tajawal","Segoe UI",Tahoma,"Geeza Pro","Noto Sans Arabic",sans-serif;
  --font-head:"Cairo","Tajawal","Segoe UI",Tahoma,"Geeza Pro",sans-serif;
  --base:17px; --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16121e; --surface:#211b2c; --ink:#efe9f8; --muted:#b4aac7; --line:#382f48;
    --accent:color-mix(in srgb, var(--h-mauve) 72%, #ffffff);
    --accent-soft:color-mix(in srgb, var(--h-mauve) 20%, var(--surface));
    --mauve-tint:color-mix(in srgb, var(--h-mauve) 32%, var(--surface));
    --rose-ink:color-mix(in srgb, var(--h-rose) 78%, #ffffff);
    --rose-soft:color-mix(in srgb, var(--h-rose) 17%, var(--surface));
    --sky-ink:color-mix(in srgb, var(--h-sky) 78%, #ffffff);
    --sky-soft:color-mix(in srgb, var(--h-sky) 17%, var(--surface));
    --amber-soft:color-mix(in srgb, #e7b45a 18%, var(--surface));
    --on-accent:#1b1427; --ok:#86d5ab; --ok-soft:#1d3528; --no:#f1a3b6; --no-soft:#41222e;
    --shadow:0 1px 2px rgb(0 0 0 / .3), 0 10px 28px rgb(0 0 0 / .35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16121e; --surface:#211b2c; --ink:#efe9f8; --muted:#b4aac7; --line:#382f48;
  --accent:color-mix(in srgb, var(--h-mauve) 72%, #ffffff);
  --accent-soft:color-mix(in srgb, var(--h-mauve) 20%, var(--surface));
  --mauve-tint:color-mix(in srgb, var(--h-mauve) 32%, var(--surface));
  --rose-ink:color-mix(in srgb, var(--h-rose) 78%, #ffffff);
  --rose-soft:color-mix(in srgb, var(--h-rose) 17%, var(--surface));
  --sky-ink:color-mix(in srgb, var(--h-sky) 78%, #ffffff);
  --sky-soft:color-mix(in srgb, var(--h-sky) 17%, var(--surface));
  --amber-soft:color-mix(in srgb, #e7b45a 18%, var(--surface));
  --on-accent:#1b1427; --ok:#86d5ab; --ok-soft:#1d3528; --no:#f1a3b6; --no-soft:#41222e;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 10px 28px rgb(0 0 0 / .35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:var(--base);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.75;font-size:1rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
body.no-scroll{overflow:hidden}
h1,h2,h3,h4{font-family:var(--font-head);line-height:1.35;text-wrap:balance;margin:0}
p{margin:0 0 .8em}
a{color:var(--accent)}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky-ink);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1140px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.i{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:0;cursor:pointer;text-decoration:none;
  background:var(--accent);color:var(--on-accent);font-weight:700;padding:.65em 1.2em;border-radius:999px;min-height:44px;transition:transform .15s, filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.sm{min-height:38px;padding:.4em .95em;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link-btn{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:.3em .2em;text-decoration:underline;text-underline-offset:4px}

/* ---------- header & nav ---------- */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);min-width:0}
.brand-mark{width:46px;height:52px;flex:none;display:grid;place-items:center}
.brand-mark img{width:46px;height:52px;object-fit:contain;border-radius:10px}
.brand b{display:block;font-family:var(--font-head);font-size:1.3rem;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:.85rem}
.top-meta{display:flex;flex-direction:column;align-items:flex-end;color:var(--muted);font-size:.82rem;line-height:1.5;text-align:left}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb, var(--surface) 92%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:10px;padding-block:8px}
.nav-links{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding-block:2px}
.nav-links::-webkit-scrollbar{display:none}
.nav-link{display:inline-flex;align-items:center;gap:.4em;white-space:nowrap;padding:.45em .9em;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.92rem;min-height:40px}
.nav-link:hover{background:var(--accent-soft);color:var(--accent)}
.nav-link[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.search-btn{flex:none;display:inline-flex;align-items:center;gap:.35em;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.4em .9em;min-height:40px;cursor:pointer;font-weight:700;color:var(--accent)}
.search-btn[aria-expanded="true"]{background:var(--accent-soft)}
.search-panel{border-top:1px solid var(--line);background:var(--surface);padding-block:12px 14px;max-height:70vh;overflow:auto}
.search-panel input{width:100%;font:inherit;padding:.7em 1em;border:2px solid var(--mauve-tint);border-radius:14px;background:var(--bg);color:var(--ink)}
.search-panel input:focus{outline:none;border-color:var(--accent)}
#results{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
#results .hint{color:var(--muted);font-size:.92rem;padding:.4em .2em}
.res-item{width:100%;text-align:right;display:grid;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:.6em .9em;cursor:pointer}
.res-item:hover{border-color:var(--accent)}
.ri-sec{font-size:.78rem;color:var(--rose-ink);font-weight:700}
.ri-t{font-weight:700}
.ri-x{font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- page / sections ---------- */
main{outline:none;min-height:60vh}
.page{padding-block:28px 56px}
.crumb{display:flex;gap:.5em;align-items:center;font-size:.85rem;color:var(--muted);margin-bottom:10px}
.crumb a{color:var(--muted)}
.sec-title{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800;color:var(--ink)}
.sec-intro{max-width:68ch;color:var(--muted);font-size:1.05rem;margin-top:10px}
.sec-head{margin-bottom:24px}
.sec-img{margin:18px 0 0;max-width:760px}
.sec-img img{width:100%;max-height:340px;object-fit:cover;border-radius:var(--r);display:block}
.sec-foot{display:flex;flex-wrap:wrap;gap:10px;margin-top:36px;padding-top:20px;border-top:1px dashed var(--line)}
.rich ul,.rich ol{padding-inline-start:1.3em;margin:.2em 0 .8em}
.rich li{margin-bottom:.35em}
.rich h4{font-size:1.02rem;margin:1em 0 .4em;color:var(--accent)}
.k-note{background:var(--rose-soft);border-inline-start:4px solid var(--h-rose);padding:.7em 1em;border-radius:10px;margin:.8em 0;font-weight:500}
.table-scroll{overflow-x:auto;margin:.6em 0 1em}
.ws-table{border-collapse:collapse;width:100%;font-size:.95rem;min-width:480px}
.ws-table th,.ws-table td{border:1px solid var(--line);padding:.55em .75em;text-align:right;vertical-align:top}
.ws-table th{background:var(--accent-soft);color:var(--accent);font-family:var(--font-head)}
.ws-table tr:nth-child(even) td{background:color-mix(in srgb, var(--bg) 60%, var(--surface))}
.ws-big td{height:3em;vertical-align:middle}
.ws-pic{font-size:1.8rem;text-align:center!important;width:4em}
.ws-box{display:inline-block;width:2.4em;height:2.4em;border:2px solid var(--muted);border-radius:8px;vertical-align:middle}
.ws-line{min-width:10em}
.ws-row{font-size:1.25rem;line-height:2.4}
.ws-checks{list-style:none;padding:0}
.ws-checks li::before{content:"☐ ";font-size:1.2em}
.k-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:.8em 0}
.k-card{border:2px dashed var(--mauve-tint);border-radius:14px;aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;background:var(--surface)}
.k-big{font-family:var(--font-head);font-size:2.1rem;font-weight:700}

/* ---------- home ---------- */
.hero{background:linear-gradient(180deg,var(--accent-soft),var(--bg));border-bottom:1px solid var(--line)}
.hero-in{display:grid;grid-template-columns:1.25fr .75fr;gap:32px;align-items:center;padding-block:40px 44px}
.hero-text{min-width:0}
.eyebrow{font-size:.85rem;font-weight:700;color:var(--rose-ink);letter-spacing:.02em;margin-bottom:6px}
.hero-title{font-size:clamp(2.3rem,7vw,3.8rem);font-weight:800;line-height:1.15;color:var(--ink)}
.hero-tag{font-family:var(--font-head);font-size:clamp(1.15rem,3vw,1.5rem);color:var(--accent);font-weight:700;margin:6px 0 14px}
.hero-intro{max-width:56ch;font-size:1.06rem}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.hero-art{display:grid;place-items:center;min-width:0}
.hero-art svg{width:100%;max-width:300px;height:auto}
.hero-art img{border-radius:24px;max-height:360px;object-fit:cover}
.band{padding-block:34px}
.band h2{font-size:1.45rem;font-weight:800;margin-bottom:16px}
.split{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:start}
.split > *{min-width:0}
.goals{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:g}
.goal{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.goal::before{counter-increment:g;content:counter(g, arabic-indic);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sky-soft);color:var(--sky-ink);font-weight:800;font-family:var(--font-head)}
.goal > .ed-ctrl{grid-column:1/-1}
.about{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.about h3{font-size:1.05rem;color:var(--accent);margin-bottom:4px}
.about p{color:var(--muted)}
.about dl{margin:0;display:grid;gap:8px}
.about dt{font-size:.8rem;color:var(--muted)}
.about dd{margin:0;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tile{position:relative;display:grid;gap:4px;align-content:start;padding:18px 18px 44px;border-radius:var(--r);text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);transition:transform .18s, box-shadow .18s}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.tile-ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;margin-bottom:6px;font-size:1.3rem}
.tile.c0 .tile-ico{background:var(--accent-soft);color:var(--accent)}
.tile.c1 .tile-ico{background:var(--rose-soft);color:var(--rose-ink)}
.tile.c2 .tile-ico{background:var(--sky-soft);color:var(--sky-ink)}
.tile-t{font-family:var(--font-head);font-weight:800;font-size:1.1rem}
.tile-s{color:var(--muted);font-size:.9rem}
.tile-go{position:absolute;inset-inline-start:18px;bottom:12px;font-size:.85rem;font-weight:700;color:var(--accent)}

/* ---------- accordion ---------- */
.acc-tools{display:flex;justify-content:flex-end;margin:-8px 0 8px}
.acc-list{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;max-width:900px}
.acc{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);scroll-margin-top:90px;transition:box-shadow .2s}
.acc-h{font-size:1.08rem}
.acc-btn{width:100%;display:flex;align-items:center;gap:12px;text-align:right;background:none;border:0;cursor:pointer;padding:16px 18px;font-family:var(--font-head);font-weight:700;font-size:1.06rem;color:var(--ink);min-height:56px}
.acc-h-edit{display:flex;align-items:center;gap:12px;padding:16px 18px 6px}
.acc-title{flex:1}
.acc-ico{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.chev{width:12px;height:12px;border-inline-start:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(-45deg);transition:transform .2s;flex:none;margin-inline-start:6px}
.acc-btn[aria-expanded="true"] .chev{transform:rotate(135deg)}
.acc-btn[aria-expanded="true"]{color:var(--accent)}
.acc-panel{padding:4px 18px 18px;padding-inline-start:68px;animation:reveal .25s ease}
.item-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
@keyframes reveal{from{opacity:.3;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ---------- strategies ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.35em .95em;cursor:pointer;font-weight:700;font-size:.9rem;color:var(--muted);min-height:38px}
.chip small{font-weight:500;opacity:.8}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.strat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;align-items:start}
.strat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:8px;scroll-margin-top:90px;min-width:0}
.strat-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{display:inline-block;font-size:.78rem;font-weight:700;padding:.2em .7em;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag.c1{background:var(--rose-soft);color:var(--rose-ink)}
.tag.c2{background:var(--sky-soft);color:var(--sky-ink)}
.tag.c3{background:var(--amber-soft);color:var(--ink)}
.tag.c4{background:var(--ok-soft);color:var(--ok)}
.dur{display:inline-flex;align-items:center;gap:.3em;font-size:.85rem;color:var(--muted);font-weight:500}
.strat-title{font-size:1.18rem;font-weight:800}
.strat-goal{margin:0;color:var(--ink)}
.strat-goal b{color:var(--accent)}
.strat-toggle{justify-self:start;display:inline-flex;align-items:center;gap:.4em;border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:.4em 1em;font-weight:700;cursor:pointer;min-height:40px}
.strat-toggle .chev{border-color:var(--accent);width:9px;height:9px}
.strat-toggle[aria-expanded="true"] .chev{transform:rotate(135deg)}
.strat-body{border-top:1px dashed var(--line);padding-top:10px;animation:reveal .25s ease}
.strat-body h4{font-size:.98rem;color:var(--accent);margin:.6em 0 .3em}
.example{background:var(--sky-soft);border-radius:12px;padding:10px 14px;margin-top:10px}
.example h4{color:var(--sky-ink);margin-top:0}

/* ---------- activities ---------- */
.act-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.act-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;scroll-margin-top:90px}
.act-art{font-size:2.6rem;height:96px;display:grid;place-items:center;background:var(--accent-soft)}
.act-card:nth-child(3n+2) .act-art{background:var(--rose-soft)}
.act-card:nth-child(3n) .act-art{background:var(--sky-soft)}
.act-body{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.act-body h3{font-size:1.15rem;font-weight:800}
.act-body p{color:var(--muted);font-size:.95rem;margin:0;flex:1}
.act-body .btn{margin-top:8px;align-self:flex-start}

/* ---------- library ---------- */
.res-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;scroll-margin-top:90px;min-width:0}
.res > .ed-ctrl{grid-column:1/-1}
.res-ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:1.3rem;background:var(--accent-soft);color:var(--accent)}
.res-ico.worksheet{background:var(--rose-soft);color:var(--rose-ink)}
.res-ico.cards{background:var(--amber-soft);color:var(--ink)}
.res-ico.video,.res-ico.link{background:var(--sky-soft);color:var(--sky-ink)}
.res-body{min-width:0;display:grid;gap:4px}
.res-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.net{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:.1em .6em}
.res h3{font-size:1.05rem;font-weight:800}
.res p{margin:0;color:var(--muted);font-size:.92rem}
.res-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.file-chip{font-size:.8rem;color:var(--muted)}

/* ---------- flash after search ---------- */
.flash{animation:flash 2s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px var(--h-rose)}100%{box-shadow:0 0 0 0 transparent}}

/* ---------- footer ---------- */
.foot{background:var(--surface);border-top:1px solid var(--line);margin-top:20px}
.foot-in{padding-block:28px 32px;display:grid;grid-template-columns:1fr 2fr;gap:24px;align-items:start}
.foot-in > *{min-width:0}
.foot-brand{display:flex;gap:12px;align-items:center}
.foot-brand b{font-family:var(--font-head);font-size:1.2rem;display:block}

<script id="site-data" type="application/json">{"version":2,"updatedAt":"2026-10-27T15:00:00.000Z","announcements":[{"id":"n1","title":"مرحبًا بكم في نافذة الأسرة","level":"normal","date":"2026-10-27T15:00:00.000Z","image":"","body":"\u003cp\u003eستجدون هنا إعلانات برنامج صعوبات التعلم وتنبيهاته، إلى جانب الاستراتيجيات والأنشطة المنزلية. نرحب بتواصلكم مع معلمة صعوبات التعلم عند أي استفسار.\u003c/p\u003e"}],"site":{"title":"نافذة الأسرة","tagline":"معًا لدعم تعلم أبنائنا","authority":"الإدارة العامة للتعليم بمنطقة مكة المكرمة","school":"الابتدائية الحادية والخمسون","author":"أ. نوره سعد الزهراني","authorRole":"معلمة برنامج صعوبات التعلم","principal":"أ. جويرة زبرماوي","audience":"أولياء أمور الطالبات ذوات صعوبات التعلم في المرحلة الابتدائية.","logo":"","rights":"© ١٤٤٨هـ / ٢٠٢٦م جميع الحقوق محفوظة لـ أ. نوره سعد الزهراني، معلمة برنامج صعوبات التعلم بالابتدائية الحادية والخمسين. لا يجوز نسخ محتوى هذه الصفحة أو إعادة نشره أو استخدامه تجاريًا دون إذن مكتوب من المُعِدّة."},"theme":{"mauve":"#a98bd6","rose":"#eba6bd","sky":"#87cbe6","font":"Tajawal","headFont":"Cairo","scale":17},"sections":[{"id":"home","type":"home","icon":"home","title":"الرئيسية","subtitle":"تعريف بالمبادرة وأهدافها","goalsTitle":"أهداف المبادرة","intro":"\u003cp\u003eمرجع رقمي من برنامج صعوبات التعلم في مدرستنا، يساعدكم على فهم احتياجات ابنتكم، ويقدّم لكم استراتيجيات وأنشطة منزلية قصيرة وعملية تكمل ما تتعلمه في المدرسة.\u003c/p\u003e","image":"","items":[{"id":"g1","text":"تعريف الأسرة بصعوبات التعلم بلغة واضحة ومبسطة."},{"id":"g2","text":"تزويد الأسرة باستراتيجيات منزلية عملية في القراءة والكتابة والرياضيات."},{"id":"g3","text":"تنمية استقلالية الطالبة وثقتها بنفسها في المذاكرة وتنظيم واجباتها."},{"id":"g4","text":"توفير أنشطة تفاعلية وأوراق عمل جاهزة للتدريب في المنزل."},{"id":"g5","text":"تعزيز التواصل والتكامل بين المدرسة والأسرة لخدمة الطالبة."}]},{"id":"understand","type":"accordion","icon":"bulb","title":"افهم صعوبات التعلم","subtitle":"المفهوم، والمؤشرات، وتصحيح المفاهيم الشائعة","intro":"\u003cp\u003eقبل أن نساعد بناتنا، نحتاج أن نفهم ما يمررن به. افتحوا كل بطاقة لقراءة تفاصيلها.\u003c/p\u003e","image":"","items":[{"id":"u1","icon":"bulb","title":"ما صعوبات التعلم؟","body":"\u003cp\u003eصعوبات التعلم اضطراب في واحدة أو أكثر من العمليات الذهنية الأساسية التي نحتاجها للتعلم، مثل \u003cb\u003eالانتباه والإدراك والذاكرة والتفكير واللغة\u003c/b\u003e. ويظهر أثرها في القراءة أو الكتابة والإملاء أو الرياضيات.\u003c/p\u003e\u003cp\u003eتكون قدرات الطالبة العقلية عادةً متوسطة أو أعلى، لكن تحصيلها في مهارة معينة أقل مما نتوقعه منها. ولا تعود الصعوبة أساسًا إلى إعاقة بصرية أو سمعية أو عقلية، ولا إلى نقص فرص التعلم.\u003c/p\u003e\u003cp\u003e\u003cb\u003eببساطة:\u003c/b\u003e ابنتكم قادرة على التعلم، لكن دماغها يعالج بعض المعلومات بطريقة مختلفة، فتحتاج إلى طرق تدريس مناسبة، ووقت أطول، وتدريب منظم.\u003c/p\u003e\u003cdiv class=\"k-note\"\u003eصعوبات التعلم لا تعني ضعف الذكاء، ولا تعني الكسل أو الإهمال.\u003c/div\u003e"},{"id":"u2","icon":"scale","title":"الفرق بين صعوبات التعلم والتأخر الدراسي","body":"\u003cp\u003eيتشابه الأمران في أن الطالبة لا تحقق المستوى المتوقع، لكنهما يختلفان في السبب ونوع المساعدة:\u003c/p\u003e\u003ctable class=\"ws-table\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eوجه المقارنة\u003c/th\u003e\u003cth\u003eصعوبات التعلم\u003c/th\u003e\u003cth\u003eالتأخر الدراسي\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالقدرات العقلية\u003c/td\u003e\u003ctd\u003eمتوسطة أو أعلى من المتوسط\u003c/td\u003e\u003ctd\u003eمتوسطة غالبًا، وقد تكون أقل من المتوسط بقليل\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمجال الضعف\u003c/td\u003e\u003ctd\u003eمحدد في مهارة أو أكثر (القراءة، الكتابة، الرياضيات)، وقد تتميز الطالبة في مجالات أخرى\u003c/td\u003e\u003ctd\u003eعام، ويظهر في أغلب المواد الدراسية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالسبب\u003c/td\u003e\u003ctd\u003eاختلاف في العمليات الذهنية مثل الانتباه والإدراك والذاكرة ومعالجة اللغة\u003c/td\u003e\u003ctd\u003eأسباب متعددة مثل الغياب المتكرر، أو ضعف الدافعية، أو ظروف صحية أو أسرية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالاستجابة للتدريس المعتاد\u003c/td\u003e\u003ctd\u003eمحدودة، وتحتاج إلى استراتيجيات تدريس خاصة\u003c/td\u003e\u003ctd\u003eتتحسن غالبًا بزيادة المتابعة ومعالجة السبب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالخدمة المناسبة\u003c/td\u003e\u003ctd\u003eبرنامج صعوبات التعلم (غرفة المصادر) وخطة تربوية فردية\u003c/td\u003e\u003ctd\u003eخطط علاجية داخل الفصل ومتابعة من الأسرة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cdiv class=\"k-note\"\u003eالتمييز بينهما مسؤولية فريق المدرسة بعد ملاحظة وتقييم دقيقين، فلا تعتمدوا على هذه المقارنة وحدها في الحكم.\u003c/div\u003e"},{"id":"u3","icon":"book","title":"مؤشرات في القراءة","body":"\u003cul\u003e\u003cli\u003eصعوبة التمييز بين الحروف المتشابهة شكلًا (ب ت ث، ج ح خ) أو صوتًا (س ص، ت ط، ذ ز ظ).\u003c/li\u003e\u003cli\u003eبطء شديد في القراءة وتقطيع الكلمة حرفًا حرفًا بعد المرحلة المتوقعة لذلك.\u003c/li\u003e\u003cli\u003eحذف حروف أو كلمات أو إضافتها أو إبدالها أثناء القراءة.\u003c/li\u003e\u003cli\u003eتخمين الكلمة من أولها أو من الصورة المرافقة.\u003c/li\u003e\u003cli\u003eفهم ضعيف لما تقرؤه بنفسها، مع فهم جيد للقصة نفسها عندما تُقرأ لها.\u003c/li\u003e\u003cli\u003eتجنب القراءة الجهرية والشعور بالقلق منها.\u003c/li\u003e\u003c/ul\u003e"},{"id":"u4","icon":"pen","title":"مؤشرات في الكتابة والإملاء","body":"\u003cul\u003e\u003cli\u003eكتابة بعض الحروف أو الأرقام معكوسة الاتجاه بعد الصف الثاني.\u003c/li\u003e\u003cli\u003eصعوبة نسخ الكلمات من السبورة أو الكتاب.\u003c/li\u003e\u003cli\u003eتكرار الأخطاء الإملائية نفسها، مثل التاء المربوطة والمفتوحة، واللام الشمسية والقمرية، وحروف المد.\u003c/li\u003e\u003cli\u003eخط يصعب قراءته، وعدم الالتزام بالسطر والمسافات بين الكلمات.\u003c/li\u003e\u003cli\u003eصعوبة ترتيب الأفكار في جملة أو فقرة مكتوبة.\u003c/li\u003e\u003cli\u003eبطء ملحوظ في الكتابة وتعب سريع منها.\u003c/li\u003e\u003c/ul\u003e"},{"id":"u5","icon":"calc","title":"مؤشرات في الرياضيات","body":"\u003cul\u003e\u003cli\u003eصعوبة ربط العدد بالكمية التي يمثلها، وأخطاء في العدّ.\u003c/li\u003e\u003cli\u003eالخلط بين الأرقام المتشابهة مثل (٢ و٦) و(٧ و٨).\u003c/li\u003e\u003cli\u003eصعوبة في القيمة المنزلية وفي كتابة الأعداد المكونة من أكثر من رقم.\u003c/li\u003e\u003cli\u003eالخلط بين رموز العمليات (+ − × ÷).\u003c/li\u003e\u003cli\u003eصعوبة تذكر الحقائق الأساسية مثل حقائق الجمع وجدول الضرب.\u003c/li\u003e\u003cli\u003eصعوبة فهم المسألة اللفظية وتحديد العملية المطلوبة.\u003c/li\u003e\u003c/ul\u003e\u003cdiv class=\"k-note\"\u003eظهور مؤشر أو اثنين لا يعني وجود صعوبة تعلم. إذا لاحظتم عدة مؤشرات تستمر مدة طويلة، فتواصلوا مع معلمة صعوبات التعلم.\u003c/div\u003e"},{"id":"u6","icon":"alert","title":"مفاهيم شائعة وتصحيحها","body":"\u003ctable class=\"ws-table\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمفهوم الشائع\u003c/th\u003e\u003cth\u003eالحقيقة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e«ابنتي كسولة ولا تريد أن تتعلم.»\u003c/td\u003e\u003ctd\u003eالطالبة غالبًا تبذل جهدًا مضاعفًا، والتعب أو التجنب نتيجة للصعوبة وليس سببها.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e«صعوبات التعلم تعني ضعف الذكاء.»\u003c/td\u003e\u003ctd\u003eقدراتها العقلية متوسطة أو أعلى، والصعوبة في مهارات محددة.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e«ستزول وحدها عندما تكبر.»\u003c/td\u003e\u003ctd\u003eالصعوبة لا تختفي بالانتظار، لكنها تتحسن كثيرًا بالتدخل المبكر والمنظم.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e«كثرة النسخ والتكرار تكفي.»\u003c/td\u003e\u003ctd\u003eالتدريب المفيد قصير ومتنوع ويستخدم أكثر من حاسة، أما النسخ الطويل فيرهقها دون فائدة تُذكر.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e«العقاب والمقارنة يدفعانها إلى الاجتهاد.»\u003c/td\u003e\u003ctd\u003eيضعفان ثقتها بنفسها ويزيدان قلقها، والتشجيع على الجهد هو ما يصنع الفرق.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e«التحاقها ببرنامج صعوبات التعلم أمر مقلق.»\u003c/td\u003e\u003ctd\u003eالبرنامج خدمة داعمة تساعدها على اللحاق بزميلاتها، وتبقى في فصلها معهن أغلب الوقت.\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e"}]},{"id":"strategies","type":"strategies","icon":"spark","title":"استراتيجيات الدعم المنزلي","subtitle":"بطاقات عملية: الهدف، والأدوات، والخطوات، ومثال","intro":"\u003cp\u003eاختاروا استراتيجية واحدة أو اثنتين وطبقوهما بانتظام لمدة أسبوعين قبل الانتقال إلى غيرهما. الجلسة القصيرة اليومية أنفع من جلسة طويلة في نهاية الأسبوع.\u003c/p\u003e","image":"","items":[{"id":"st1","category":"القراءة","title":"القراءة المتكررة المصاحَبة","goal":"زيادة طلاقة القراءة ودقتها وثقة الطالبة بنفسها أثناء القراءة.","tools":"\u003cul\u003e\u003cli\u003eنص قصير من كتاب لغتي (٣ إلى ٥ جمل).\u003c/li\u003e\u003cli\u003eقلم رصاص لوضع خط خفيف تحت الكلمات الصعبة.\u003c/li\u003e\u003c/ul\u003e","steps":"\u003col\u003e\u003cli\u003eاقرؤوا النص بصوت واضح وهادئ وهي تتابع بإصبعها تحت الكلمات.\u003c/li\u003e\u003cli\u003eاقرؤوه معها بصوت واحد مرتين.\u003c/li\u003e\u003cli\u003eتقرؤه وحدها، وساعدوها في الكلمة الصعبة فورًا دون تعليق طويل.\u003c/li\u003e\u003cli\u003eأعيدوا قراءة النص نفسه في اليوم التالي، ولاحظوا معها كيف تحسنت.\u003c/li\u003e\u003c/ol\u003e","example":"\u003cp\u003eفي جملة «ذهبت سارة إلى الحديقة مع أمها» تقرأ الأم الجملة، ثم تقرآنها معًا، ثم تقرؤها سارة وحدها. إذا تعثرت في كلمة «الحديقة» تنطقها الأم، وتعيد سارة الجملة كاملة.\u003c/p\u003e","duration":"١٠ دقائق يوميًا"},{"id":"st2","category":"القراءة","title":"التحليل والتركيب الصوتي بالمربعات","goal":"تدريبها على سماع أصوات الكلمة منفصلة ثم دمجها، وهي مهارة أساسية لقراءة الكلمات الجديدة.","tools":"\u003cul\u003e\u003cli\u003eورقة مرسوم عليها ٣ أو ٤ مربعات متجاورة.\u003c/li\u003e\u003cli\u003eأزرار أو حبوب أو قطع عدّ صغيرة.\u003c/li\u003e\u003c/ul\u003e","steps":"\u003col\u003e\u003cli\u003eانطقوا كلمة قصيرة ببطء مع إطالة كل صوت.\u003c/li\u003e\u003cli\u003eتضع قطعة في مربع مع كل صوت تسمعه، بدءًا من المربع الأيمن.\u003c/li\u003e\u003cli\u003eتلمس القطع واحدة تلو الأخرى وتنطق أصواتها، ثم تدمجها بسرعة لتقول الكلمة كاملة.\u003c/li\u003e\u003cli\u003eبعد إتقانها، تكتب الحرف المناسب داخل كل مربع بدل القطعة.\u003c/li\u003e\u003c/ol\u003e","example":"\u003cp\u003eكلمة «شمس»: تضع قطعة لصوت /ش/ ثم /م/ ثم /س/، ثم تمرر إصبعها على المربعات بسرعة وتقول: «شمس».\u003c/p\u003e","duration":"٧ إلى ١٠ دقائق"},{"id":"st3","category":"الإملاء والكتابة","title":"انظري، قولي، غطّي، اكتبي، تحققي","goal":"تثبيت الصورة الإملائية للكلمات الصعبة في الذاكرة.","tools":"\u003cul\u003e\u003cli\u003eبطاقات تحمل كلمات الإملاء (٥ كلمات فقط في الجلسة).\u003c/li\u003e\u003cli\u003eورقة وقلم، وورقة صغيرة لتغطية الكلمة.\u003c/li\u003e\u003cli\u003eقلم ملون.\u003c/li\u003e\u003c/ul\u003e","steps":"\u003col\u003e\u003cli\u003eتنظر إلى الكلمة، وتلوّن الحرف الصعب فيها.\u003c/li\u003e\u003cli\u003eتقول الكلمة بصوت مسموع وتتهجى حروفها.\u003c/li\u003e\u003cli\u003eتغطي الكلمة بالورقة.\u003c/li\u003e\u003cli\u003eتكتبها من ذاكرتها.\u003c/li\u003e\u003cli\u003eتكشف الكلمة وتقارن، وتصحح الحرف الخطأ فقط، ثم تعيد المحاولة.\u003c/li\u003e\u003c/ol\u003e","example":"\u003cp\u003eكلمة «مدرسة»: تلوّن التاء المربوطة، وتقول «مدرسة: ميم، دال، راء، سين، تاء مربوطة»، ثم تغطيها وتكتبها وتتحقق منها.\u003c/p\u003e","duration":"١٠ إلى ١٥ دقيقة"},{"id":"st4","category":"الإملاء والكتابة","title":"كتابة الحروف بالحواس المتعددة","goal":"تحسين تذكر شكل الحرف واتجاه كتابته بربط النظر والصوت والحركة.","tools":"\u003cul\u003e\u003cli\u003eصينية فيها ملح أو رمل أو سميد.\u003c/li\u003e\u003cli\u003eبطاقة كبيرة للحرف.\u003c/li\u003e\u003cli\u003eصلصال (اختياري).\u003c/li\u003e\u003c/ul\u003e","steps":"\u003col\u003e\u003cli\u003eتنظر إلى الحرف وتسمع صوته منكم.\u003c/li\u003e\u003cli\u003eترسمه بإصبعها في الصينية وهي تنطق صوته، مع البدء من نقطة البداية الصحيحة.\u003c/li\u003e\u003cli\u003eتشكّل الحرف بالصلصال أو تتبعه بإصبعها على البطاقة.\u003c/li\u003e\u003cli\u003eتكتبه على الورق ثلاث مرات فقط بخط واضح.\u003c/li\u003e\u003c/ol\u003e","example":"\u003cp\u003eحرف «ج»: تقول «جيم، صوته جَ»، وترسم الحرف في الملح ثم تضع النقطة تحته، وتكرر ذلك مع كلمة «جمل».\u003c/p\u003e","duration":"٥ إلى ١٠ دقائق"},{"id":"st5","category":"الرياضيات","title":"من المحسوس إلى المصوّر إلى المجرد","goal":"فهم القيمة المنزلية والعمليات الحسابية بدل حفظها دون فهم.","tools":"\u003cul\u003e\u003cli\u003eأعواد مثلجات أو أقلام، ورباطات مطاطية.\u003c/li\u003e\u003cli\u003eورقة مقسمة إلى خانتين: العشرات والآحاد.\u003c/li\u003e\u003c/ul\u003e","steps":"\u003col\u003e\u003cli\u003eالمحسوس: تعدّ الأعواد، وتربط كل ١٠ أعواد في حزمة واحدة.\u003c/li\u003e\u003cli\u003eالمصوّر: ترسم الحزمة خطًا طويلًا، والعود المفرد نقطة.\u003c/li\u003e\u003cli\u003eالمجرد: تكتب العدد بالأرقام في خانتي العشرات والآحاد.\u003c/li\u003e\u003cli\u003eاطلبوا منها أن تشرح لكم ما فعلته بكلماتها.\u003c/li\u003e\u003c/ol\u003e","example":"\u003cp\u003eالعدد ٢٤: حزمتان وأربعة أعواد، ثم خطان وأربع نقاط، ثم يُكتب ٢ في خانة العشرات و٤ في خانة الآحاد.\u003c/p\u003e","duration":"١٥ دقيقة"},{"id":"st6","category":"الرياضيات","title":"خط الأعداد للجمع والطرح","goal":"تخيّل عمليتي الجمع والطرح بصريًا، والتقليل التدريجي من العدّ على الأصابع.","tools":"\u003cul\u003e\u003cli\u003eشريط ورقي مرقّم من ٠ إلى ٢٠، أو خط مرسوم على الأرض بشريط لاصق.\u003c/li\u003e\u003cli\u003eقطعة صغيرة تستخدم مؤشرًا.\u003c/li\u003e\u003c/ul\u003e","steps":"\u003col\u003e\u003cli\u003eتضع المؤشر على العدد الأول في المسألة.\u003c/li\u003e\u003cli\u003eفي الجمع تقفز نحو الأعداد الأكبر بعدد الوحدات المطلوبة، وفي الطرح ترجع نحو الأعداد الأصغر.\u003c/li\u003e\u003cli\u003eتقول العدد بصوت مسموع عند كل قفزة.\u003c/li\u003e\u003cli\u003eتكتب العملية والناتج.\u003c/li\u003e\u003c/ol\u003e","example":"\u003cp\u003eالمسألة ٧ + ٥: تبدأ من ٧، وتقفز خمس قفزات وهي تقول: ٨، ٩، ١٠، ١١، ١٢. الناتج ١٢.\u003c/p\u003e","duration":"١٠ دقائق"},{"id":"st7","category":"الانتباه والذاكرة","title":"تعليمات قصيرة ومهمة مقسّمة","goal":"مساعدتها على البدء في المهمة وإنهائها دون تشتت.","tools":"\u003cul\u003e\u003cli\u003eمؤقت (ساعة المطبخ أو مؤقت الجوال).\u003c/li\u003e\u003cli\u003eبطاقات صغيرة لكتابة خطوات المهمة.\u003c/li\u003e\u003c/ul\u003e","steps":"\u003col\u003e\u003cli\u003eاحصلوا على انتباهها أولًا: نادوها باسمها وانظروا إليها.\u003c/li\u003e\u003cli\u003eأعطوها تعليمة واحدة قصيرة في كل مرة.\u003c/li\u003e\u003cli\u003eاطلبوا منها أن تعيد التعليمة بكلماتها.\u003c/li\u003e\u003cli\u003eقسّموا المهمة الطويلة إلى أجزاء، وضعوا علامة ✓ بعد إنهاء كل جزء.\u003c/li\u003e\u003cli\u003eأبعدوا المشتتات عن مكان المذاكرة: التلفاز والجوال والألعاب.\u003c/li\u003e\u003c/ol\u003e","example":"\u003cp\u003eبدل أن تقولوا «حلّي واجب الرياضيات كله»، قولوا: «حلّي المسائل الثلاث الأولى، ثم أريني إياها».\u003c/p\u003e","duration":"طوال وقت المذاكرة"},{"id":"st8","category":"الانتباه والذاكرة","title":"ألعاب تقوية الذاكرة العاملة","goal":"تنمية قدرتها على الاحتفاظ بالمعلومات واستعادتها لفترة قصيرة.","tools":"\u003cul\u003e\u003cli\u003eلا تحتاج أدوات، أو صينية فيها ٥ إلى ٨ أغراض منزلية ومنديل.\u003c/li\u003e\u003c/ul\u003e","steps":"\u003col\u003e\u003cli\u003eلعبة «ذهبتُ إلى السوق»: يعيد كل لاعب ما ذُكر قبله ويضيف غرضًا جديدًا.\u003c/li\u003e\u003cli\u003eلعبة «ماذا اختفى؟»: تنظر إلى الأغراض ٣٠ ثانية، ثم تغمض عينيها، فتخفون غرضًا وتسألونها عنه.\u003c/li\u003e\u003cli\u003eابدؤوا بعدد قليل من الأغراض، وزيدوه تدريجيًا عندما تنجح.\u003c/li\u003e\u003c/ol\u003e","example":"\u003cp\u003e«ذهبتُ إلى السوق واشتريت تفاحًا»، ثم «... تفاحًا وخبزًا»، ثم «... تفاحًا وخبزًا وحليبًا».\u003c/p\u003e","duration":"٥ إلى ١٠ دقائق"},{"id":"st9","category":"تنظيم الواجبات والاستذكار","title":"روتين مذاكرة ثابت وجدول مرئي","goal":"جعل المذاكرة عادة يومية متوقعة تقلل التوتر والتأجيل.","tools":"\u003cul\u003e\u003cli\u003eجدول المذاكرة الأسبوعي (متوفر في مكتبة الأسرة).\u003c/li\u003e\u003cli\u003eمؤقت.\u003c/li\u003e\u003cli\u003eمكان هادئ وثابت للمذاكرة.\u003c/li\u003e\u003c/ul\u003e","steps":"\u003col\u003e\u003cli\u003eحددوا وقتًا ثابتًا يوميًا بعد الراحة والغداء.\u003c/li\u003e\u003cli\u003eابدؤوا بالمهمة الأسهل لتشعر بالنجاح، ثم انتقلوا إلى الأصعب.\u003c/li\u003e\u003cli\u003eذاكروا ١٥ دقيقة، ثم استراحة قصيرة مدتها ٥ دقائق.\u003c/li\u003e\u003cli\u003eتضع علامة على الجدول بعد إنهاء كل واجب.\u003c/li\u003e\u003cli\u003eاختموا بكلمة تشجيع على جهدها.\u003c/li\u003e\u003c/ol\u003e","example":"\u003cp\u003eالرابعة والنصف: واجب لغتي (١٥ دقيقة)، ثم استراحة، ثم الرياضيات (١٥ دقيقة)، ثم مراجعة قصيرة للإملاء.\u003c/p\u003e","duration":"٣٠ إلى ٤٥ دقيقة على فترات"},{"id":"st10","category":"تنظيم الواجبات والاستذكار","title":"قائمة التحقق قبل النوم","goal":"تنمية الاستقلالية والمسؤولية في تجهيز أدواتها المدرسية.","tools":"\u003cul\u003e\u003cli\u003eقائمة مصورة معلقة بجانب الحقيبة.\u003c/li\u003e\u003cli\u003eقلم أو مشبك لتعليم البنود.\u003c/li\u003e\u003c/ul\u003e","steps":"\u003col\u003e\u003cli\u003eصمّموا معها قائمة مصورة: كتب اليوم حسب الجدول، والدفاتر، والمقلمة، وقارورة الماء.\u003c/li\u003e\u003cli\u003eتراجع القائمة وحدها كل مساء، وتضع علامة على كل بند.\u003c/li\u003e\u003cli\u003eراجعوا معها في الأسبوع الأول فقط، ثم قللوا المساعدة تدريجيًا.\u003c/li\u003e\u003cli\u003eامدحوا استقلاليتها عندما تنجز القائمة وحدها.\u003c/li\u003e\u003c/ol\u003e","example":"\u003cp\u003eقبل النوم تنظر إلى جدول الغد، وتضع كتاب الرياضيات ودفتر الإملاء في الحقيبة، ثم تعلّم البندين في القائمة.\u003c/p\u003e","duration":"٥ دقائق مساءً"}]},{"id":"activities","type":"activities","icon":"puzzle","title":"أنشطة منزلية تفاعلية","subtitle":"ألعاب قصيرة بتصحيح فوري","intro":"\u003cp\u003eأنشطة قصيرة تمارسها ابنتكم معكم في نحو خمس دقائق. اجلسوا بجانبها، وشجعوها على المحاولة، ولا تستعجلوا الإجابة عنها؛ فكل نشاط يتيح المحاولة مرة أخرى عند الخطأ.\u003c/p\u003e","image":"","items":[{"id":"a1","kind":"letters","emoji":"🔤","skill":"الحروف والأصوات","title":"ما الحرف الأول؟","desc":"تمييز الحرف الأول في الكلمة، واختيار الصورة التي تبدأ بحرف معين.","data":"🌙|قمر\n🐟|سمكة\n🍎|تفاحة\n🐪|جمل\n🌳|شجرة\n🦁|أسد\n🏠|بيت\n🔑|مفتاح\n🐔|دجاجة\n🌹|وردة\n🐘|فيل\n📖|كتاب\n☀️|شمس\n🍌|موز\n🐑|خروف\n🦒|زرافة\n⭐|نجمة\n🍇|عنب\n🚗|سيارة\n🐰|أرنب"},{"id":"a2","kind":"build","emoji":"🧩","skill":"تركيب الكلمات","title":"ركّبي الكلمة","desc":"رتّبي الحروف لتكوين اسم الصورة، ولاحظي كيف تتصل الحروف في الكلمة.","data":"🖊️|قلم\n☀️|شمس\n🚪|باب\n📖|كتاب\n🏠|بيت\n🌹|وردة\n🍇|عنب\n🌙|قمر\n🐪|جمل\n🐟|سمك"},{"id":"a3","kind":"sentence","emoji":"📝","skill":"قراءة الجمل","title":"أكملي الجملة","desc":"اقرئي الجملة، واختاري الكلمة التي تكمل معناها.","data":"🐱|القطة تشرب ___|الحليب|الكتاب|الكرسي\n🏫|تذهب سارة إلى ___ صباحًا|المدرسة|الوسادة|الشمس\n🌧️|ينزل المطر من ___|السحاب|الأرض|الباب\n🍞|أكلت ليلى ___ في الفطور|الخبز|القلم|الحذاء\n📚|أقرأ ___ في المكتبة|قصة|كرة|تفاحة\n🐦|يطير ___ في السماء|العصفور|القط|السمك\n🌻|سقت هند ___ في الحديقة|الزهور|الكتب|الملابس\n🧼|أغسل يديّ بالماء و___|الصابون|الحليب|الرمل"},{"id":"a4","kind":"place","emoji":"🔢","skill":"القيمة المنزلية","title":"القيمة المنزلية","desc":"حددي منزلة الرقم (آحاد، عشرات، مئات) وقيمته في العدد.","data":"3"},{"id":"a5","kind":"math","emoji":"➕","skill":"العمليات الحسابية","title":"الجمع والطرح بالصور","desc":"مسائل جمع وطرح قصيرة مع نقاط تساعد على العدّ.","data":"10"},{"id":"a6","kind":"memory","emoji":"🃏","skill":"الذاكرة والقراءة","title":"لعبة الذاكرة: الصورة وكلمتها","desc":"اقلبي البطاقات وطابقي كل صورة مع الكلمة التي تدل عليها.","data":"🍎|تفاحة\n🐟|سمكة\n🌙|قمر\n📖|كتاب\n🏠|بيت\n☀️|شمس\n🐪|جمل\n🌹|وردة"},{"id":"a7","kind":"sequence","emoji":"🎯","skill":"الانتباه والذاكرة","title":"تذكّري الترتيب","desc":"شاهدي ترتيب الأشكال وهي تضيء، ثم أعيديه بالترتيب نفسه.","data":"3"}]},{"id":"library","type":"library","icon":"books","title":"مكتبة الأسرة الرقمية","subtitle":"أدلة، وأوراق عمل، وبطاقات، وروابط موثوقة","intro":"\u003cp\u003eموارد جاهزة للعرض والطباعة. أوراق العمل والبطاقات تعمل دون اتصال بالإنترنت، أما الروابط ومقاطع الفيديو فتحتاج إلى اتصال.\u003c/p\u003e","image":"","items":[{"id":"l1","kind":"guide","title":"دليل الأسرة المختصر","desc":"صفحة واحدة تلخص المفهوم والقواعد الذهبية ومتى تتواصلون مع المعلمة.","content":"\u003ch4\u003eما صعوبات التعلم؟\u003c/h4\u003e\u003cp\u003eاختلاف في طريقة معالجة الدماغ لبعض المعلومات، يؤثر في القراءة أو الكتابة أو الرياضيات، مع قدرات عقلية متوسطة أو أعلى.\u003c/p\u003e\u003ch4\u003eالقواعد الذهبية الخمس\u003c/h4\u003e\u003col\u003e\u003cli\u003e\u003cb\u003eقصير ومنتظم:\u003c/b\u003e ١٠ إلى ١٥ دقيقة يوميًا أفضل من ساعة واحدة في الأسبوع.\u003c/li\u003e\u003cli\u003e\u003cb\u003eمن السهل إلى الصعب:\u003c/b\u003e ابدؤوا بما تتقنه لتشعر بالنجاح.\u003c/li\u003e\u003cli\u003e\u003cb\u003eامدحوا الجهد:\u003c/b\u003e «أعجبني أنك حاولتِ مرة أخرى».\u003c/li\u003e\u003cli\u003e\u003cb\u003eاستخدموا الحواس:\u003c/b\u003e انظري، اسمعي، المسي، تحركي.\u003c/li\u003e\u003cli\u003e\u003cb\u003eلا للمقارنة:\u003c/b\u003e قارنوها بنفسها في الأسبوع الماضي فقط.\u003c/li\u003e\u003c/ol\u003e\u003ch4\u003eمتى تتواصلون مع معلمة صعوبات التعلم؟\u003c/h4\u003e\u003cul\u003e\u003cli\u003eعندما يستغرق الواجب وقتًا أطول بكثير من المعتاد.\u003c/li\u003e\u003cli\u003eعندما تلاحظون قلقًا أو رفضًا متزايدًا للمدرسة.\u003c/li\u003e\u003cli\u003eعندما تحتاجون إلى توضيح استراتيجية أو نشاط.\u003c/li\u003e\u003cli\u003eلمشاركة تقدم لاحظتموه في المنزل.\u003c/li\u003e\u003c/ul\u003e","url":"","file":null},{"id":"l2","kind":"guide","title":"خطة العشرين دقيقة اليومية","desc":"توزيع مقترح لوقت التدريب الإضافي في المنزل.","content":"\u003cp\u003eخطة يومية بسيطة لا تتجاوز عشرين دقيقة للتدريب الإضافي، بعد إنهاء الواجبات:\u003c/p\u003e\u003ctable class=\"ws-table\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالدقائق\u003c/th\u003e\u003cth\u003eالنشاط\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e١ إلى ٥\u003c/td\u003e\u003ctd\u003eقراءة متكررة لنص قصير (القراءة المتكررة المصاحَبة).\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٦ إلى ١٠\u003c/td\u003e\u003ctd\u003eثلاث كلمات إملائية بطريقة: انظري، قولي، غطّي، اكتبي، تحققي.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١١ إلى ١٥\u003c/td\u003e\u003ctd\u003eنشاط رياضيات بالمحسوسات أو نشاط تفاعلي من هذه الصفحة.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٦ إلى ٢٠\u003c/td\u003e\u003ctd\u003eلعبة ذاكرة أو انتباه، ثم كلمة تشجيع ونجمة على لوحة النجوم.\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cdiv class=\"k-note\"\u003eإذا كانت ابنتكم متعبة، فاكتفوا بخمس دقائق ممتعة. الاستمرار أهم من المدة.\u003c/div\u003e","url":"","file":null},{"id":"l3","kind":"guide","title":"دليل إرشادات ولي الأمر على نظام صعوبات التعلم","desc":"دليل رسمي من نظام نور التابع لوزارة التعليم (ملف PDF).","content":"","url":"https://noor.moe.gov.sa/userguides/Noor/Guides/%D8%B5%D8%B9%D9%88%D8%A8%D8%A7%D8%AA%20%D8%A7%D9%84%D8%AA%D8%B9%D9%84%D9%85/%D8%AF%D9%84%D9%8A%D9%84%20%D8%A5%D8%B1%D8%B4%D8%A7%D8%AF%D8%A7%D8%AA%20%D9%88%D9%84%D9%8A%20%D8%A3%D9%85%D8%B1%20%D8%B9%D9%84%D9%89%20%D9%86%D8%B8%D8%A7%D9%85%20%D8%B5%D8%B9%D9%88%D8%A8%D8%A7%D8%AA%20%D8%A7%D9%84%D8%AA%D8%B9%D9%84%D9%85.pdf","file":null},{"id":"l4","kind":"worksheet","title":"ورقة عمل: الحرف الأول من الكلمة","desc":"تمييز الحرف الأول، ونشاط إضافي لحرف الباء.","content":"\u003cp\u003e\u003cb\u003eالتعليمات:\u003c/b\u003e انظري إلى الصورة، واقرئي الكلمة، ثم اكتبي حرفها الأول في المربع.\u003c/p\u003e\u003ctable class=\"ws-table ws-big\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالصورة\u003c/th\u003e\u003cth\u003eالكلمة\u003c/th\u003e\u003cth\u003eالحرف الأول\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd class=\"ws-pic\"\u003e🌙\u003c/td\u003e\u003ctd\u003eقمر\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"ws-box\"\u003e\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd class=\"ws-pic\"\u003e🐟\u003c/td\u003e\u003ctd\u003eسمكة\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"ws-box\"\u003e\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd class=\"ws-pic\"\u003e🐪\u003c/td\u003e\u003ctd\u003eجمل\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"ws-box\"\u003e\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd class=\"ws-pic\"\u003e🌳\u003c/td\u003e\u003ctd\u003eشجرة\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"ws-box\" /* ---------------- dialogs ---------------- */
function openDialog(o){
  return new Promise(function(resolve){
    var prev = document.activeElement;
    var back = document.createElement('div'); back.className = 'dlg-back';
    back.innerHTML = '<form class="dlg'+(o.wide?' wide':'')+'" role="dialog" aria-modal="true" aria-labelledby="dlg-t" novalidate>'+
      '<div class="dlg-h"><h2 id="dlg-t">'+esc(o.title)+'</h2><button type="button" class="x" data-close aria-label="إغلاق">×</button></div>'+
      '<div class="dlg-b"></div><div class="dlg-f"></div></form>';
    var form = back.querySelector('form'), body = back.querySelector('.dlg-b'), foot = back.querySelector('.dlg-f');
    if (typeof o.body === 'string') body.innerHTML = o.body; else if (o.body) body.appendChild(o.body);
    var actions = o.actions || [{label:'حسنًا', value:true, primary:true}];
    actions.forEach(function(a, k){
      var b = document.createElement('button'); b.type = a.primary ? 'submit' : 'button';
      b.className = 'btn' + (a.primary ? (a.danger?' danger':'') : (a.danger?' ghost danger-ghost':' ghost')); b.textContent = a.label; b.dataset.k = k;
      foot.appendChild(b);
    });
    var busy = false;
    function close(v){ document.removeEventListener('keydown', onKey, true); back.remove(); if (!document.querySelector('.dlg-back') && $('#player').hidden && $('#drawer').hidden) document.body.classList.remove('no-scroll'); if (prev && prev.focus) try{ prev.focus({preventScroll:true}); }catch(e){} resolve(v); }
    function act(a, btn){
      if (busy) return;
      var r = a.check ? a.check(body) : true;
      if (r && typeof r.then === 'function'){
        busy = true; var old = btn ? btn.textContent : ''; if (btn){ btn.disabled = true; btn.textContent = 'لحظة…'; }
        r.then(function(ok){ busy = false; if (btn){ btn.disabled = false; btn.textContent = old; } if (ok) close(a.value); })
         .catch(function(){ busy = false; if (btn){ btn.disabled = false; btn.textContent = old; } });
      } else if (r) close(a.value);
    }
    function onKey(e){ if (e.key === 'Escape' && !busy){ e.stopPropagation(); close(null); } }
    form.addEventListener('submit', function(e){ e.preventDefault(); var k = actions.findIndex(function(x){ return x.primary; }); if (k>=0) act(actions[k], foot.querySelector('[data-k="'+k+'"]')); else close(true); });
    back.addEventListener('click', function(e){
      if (busy) return;
      if (e.target === back || e.target.closest('[data-close]')) { close(null); return; }
      var b = e.target.closest('.dlg-f button[type=button]'); if (b) act(actions[+b.dataset.k], b);
    });
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(back); document.body.classList.add('no-scroll');
    if (o.onOpen) o.onOpen(body, close);
    var f = body.querySelector('input,textarea,select,[contenteditable]') || foot.querySelector('button');
    if (f) setTimeout(function(){ f.focus(); }, 30);
  });
}

/* ---------------- files ---------------- */
function pickFile(accept){
  return new Promise(function(resolve){
    var inp = document.createElement('input'); inp.type = 'file'; if (accept) inp.accept = accept;
    inp.style.display = 'none'; document.body.appendChild(inp);
    inp.addEventListener('change', function(){ resolve(inp.files && inp.files[0] || null); inp.remove(); });
    inp.click();
  });
}
function readAsDataURL(file){ return new Promise(function(res, rej){ var fr = new FileReader(); fr.onload = function(){ res(fr.result); }; fr.onerror = rej; fr.readAsDataURL(file); }); }
function readImage(file, max){
  max = max || 1400;
  return readAsDataURL(file).then(function(url){
    return new Promise(function(res, rej){
      var img = new Image();
      img.onload = function(){
        var sc = Math.min(1, max/Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL(/png|gif|webp/.test(file.type) ? 'image/png' : 'image/jpeg', .85));
      };
      img.onerror = rej; img.src = url;
    });
  });
}
function dataURLtoBlob(u){ var m = /^data:([^;,]+)?(;base64)?,(.*)$/.exec(u||''); if (!m) return null;
  if (m[2]){ var bin = atob(m[3]), arr = new Uint8Array(bin.length); for (var k=0;k<bin.length;k++) arr[k]=bin.charCodeAt(k); return new Blob([arr], {type:m[1]||'application/octet-stream'}); }
  return new Blob([decodeURIComponent(m[3])], {type:m[1]||'text/plain'}); }
/* اختيار صورة وضغطها ثم رفعها إلى الخادم؛ يعيد رابط الصورة */
function pickAndUploadImage(max){
  return pickFile('image/jpeg,image/png,image/webp,image/gif').then(function(f){
    if (!f) return null;
    toast('جارٍ رفع الصورة…');
    return readImage(f, max).then(function(u){ var bl = dataURLtoBlob(u); return uploadBlob(bl, f.name.replace(/\.[^.]+$/, '') + (bl.type==='image/png'?'.png':'.jpg')); })
      .then(function(r){ toast('تم رفع الصورة', 'ok'); return r.url; })
      .catch(function(e){ toast(e && e.status ? errMsg(e) : 'تعذّرت قراءة الصورة. جرّبي صورة JPG أو PNG.', 'err'); return null; });
  });
}
function download(name, content, mime){
  var blob = content instanceof Blob ? content : new Blob([content], {type: mime||'text/plain;charset=utf-8'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;

var saveT = null, pendingSave = false, saving = false;
function setStatus(t, kind){ var s = $('#eb-status'); if (s){ s.textContent = t; s.dataset.kind = kind||''; } }
function statusText(){
  if (META.hasDraft) return 'محفوظ كمسودة ✓ '+fmtTime(META.savedAt)+' — لم يُنشر بعد';
  return META.publishedAt ? 'كل المحتوى منشور ✓ (آخر نشر '+fmtDate(META.publishedAt)+')' : 'لم يُنشر أي محتوى من لوحة الإدارة بعد';
}
function dirty(){
  if (!editMode) return;
  pendingSave = true; setStatus('تعديلات لم تُحفظ بعد…', 'warn');
  clearTimeout(saveT); saveT = setTimeout(function(){ saveDraft(); }, 1200);
}
function saveDraft(force){
  clearTimeout(saveT); saveT = null;
  if (!pendingSave && !force) return Promise.resolve(true);
  if (saving) return new Promise(function(r){ setTimeout(function(){ r(saveDraft(force)); }, 300); });
  saving = true; pendingSave = false; setStatus('جارٍ الحفظ في قاعدة البيانات…');
  return api('PUT', '/api/draft', {content:data, baseSavedAt:META.savedAt}).then(function(r){
    saving = false; META.savedAt = r.savedAt; META.hasDraft = true; setStatus(statusText(), 'ok');
    if (pendingSave) return saveDraft();
    return true;
  }).catch(function(e){
    saving = false; pendingSave = true;
    if (e.status === 401){ setStatus('انتهت الجلسة — لم يُحفظ', 'err'); openLogin(); }
    else if (e.status === 409){ setStatus('تعارض مع جهاز آخر — لم يُحفظ', 'err'); conflictDialog(); }
    else { setStatus('لم يُحفظ: '+errMsg(e), 'err'); toast(errMsg(e), 'err'); }
    return false;
  });
}
function conflictDialog(){
  openDialog({title:'المسودة تغيّرت من جهاز آخر', body:'<p>عُدّلت المسودة من جهاز أو نافذة أخرى بعد أن فتحتِها هنا. اختاري ما تريدين:</p>',
    actions:[{label:'تحميل أحدث نسخة (أُلغي تعديلات هذه الشاشة)', value:'reload', primary:true}, {label:'اعتماد نسختي هنا', value:'mine'}, {label:'إلغاء', value:null}]
  }).then(function(v){
    if (v === 'reload'){ pendingSave = false; startAdmin(true); }
    if (v === 'mine'){ api('PUT','/api/draft',{content:data, force:true}).then(function(r){ META.savedAt = r.savedAt; META.hasDraft = true; pendingSave = false; setStatus(statusText(),'ok'); toast('تم اعتماد نسختك', 'ok'); }).catch(function(e){ toast(errMsg(e), 'err'); }); }
  });
}
function publishNow(){
  return confirmBox('سيظهر المحتوى الحالي لجميع الزوار الآن. هل تريدين النشر؟', 'نشر').then(function(ok){
    if (!ok) return;
    var first = (!META.hasDraft && !META.publishedAt) || pendingSave || saveT;
    return (first ? (pendingSave = true, saveDraft(true)) : Promise.resolve(true)).then(function(saved){
      if (!saved) return;
      if (!META.hasDraft){ toast('لا توجد تعديلات جديدة للنشر؛ كل شيء منشور.'); return; }
      setStatus('جارٍ النشر…');

/* ---------------- backup ---------------- */
function exportHTML(){
  var d = clone(data);
  var json = JSON.stringify(d).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  var out = PAGE_SOURCE.replace(/(<script id="site-data" type="application\/json">)[\s\S]*?(<\/script>)/, function(m, a, b){ return a + json + b; });
  download('nafidhat-alusra-nuskha.html', out, 'text/html;charset=utf-8');
  toast('تم تنزيل نسخة من الموقع. الصور والملفات المرفوعة تحتاج اتصالًا بالموقع لتظهر.');
}
function importJSON(){
  pickFile('.json,application/json').then(function(file){
    if (!file) return;
    file.text().then(function(t){
      var obj; try { obj = JSON.parse(t); } catch(e){ toast('الملف ليس بصيغة JSON صحيحة.', 'err'); return; }
      if (obj && obj.content && obj.content.sections) obj = obj.content;
      if (!obj || !Array.isArray(obj.sections) || !obj.site){ toast('هذا الملف لا يحتوي على محتوى «نافذة الأسرة».', 'err'); return; }
      confirmBox('سيوضع محتوى الملف «'+file.name+'» في المسودة بدل المحتوى الحالي (ولن يظهر للزوار حتى تنشريه). هل تريدين المتابعة؟', 'استيراد إلى المسودة', true).then(function(ok){
        if (!ok) return;
        data = normalize(obj); current = homeSec().id; pendingSave = true;
        saveDraft(true).then(function(saved){ renderAll(); renderDrawer(); if (saved) toast('تم الاستيراد إلى المسودة. راجعيه ثم اضغطي «نشر».', 'ok'); });
      });
    });
  });
}

/* ---------------- search ---------------- */
function norm(s){ return String(s||'').replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').toLowerCase(); }
function buildIndex(){
  var out = [];
  data.announcements.forEach(function(a){ if (!a.hidden || editMode) out.push({s:homeSec().id, i:a.id, t:a.title, sec:'إعلانات', x:strip(a.body)}); });
  visibleSections().forEach(function(s){
    out.push({s:s.id, i:null, t:s.title, sec:'قسم', x:strip(s.intro)+' '+(s.subtitle||'')});
    s.items.forEach(function(it){
      if (it.hidden && !editMode) return;
      var t = it.title || it.text || '';
      var x = [it.goal, it.desc, it.category, it.skill, it.duration, RES_KIND[it.kind], strip(it.body), strip(it.tools), strip(it.steps), strip(it.example), strip(it.content)].filter(Boolean).join(' ');
      out.push({s:s.id, i:it.id, t:t, sec:s.title, x:x});
    });
  });
  return out;
}
function doSearch(q){
  var ul = $('#results'), nq = norm(q.trim());
  if (nq.length < 2){ ul.innerHTML = q.trim() ? '<li class="hint">اكتبوا حرفين على الأقل.</li>' : ''; return; }
  var terms = nq.split(/\s+/);
  var res = buildIndex().map(function(e){
    var nt = norm(e.t), nx = norm(e.x), sc = 0;
    for (var k=0;k<terms.length;k++){ if (terms[k].length<2) continue; if (nt.indexOf(terms[k])>=0) sc += 3; else if (nx.indexOf(terms[k])>=0) sc += 1; }
    if (nt.indexOf(nq)>=0) sc += 4;
    return sc ? {e:e, sc:sc} : null;
  }).filter(Boolean).sort(function(a,b){ return b.sc-a.sc; }).slice(0,12);
  if (!res.length){ ul.innerHTML = '<li class="hint">لا توجد نتائج. جرّبوا كلمة أخرى مثل «القراءة» أو «الإملاء» أو «الواجب».</li>'; return; }
  ul.innerHTML = res.map(function(r){ var e = r.e;
    return '<li><button type="button" class="res-item" data-act="goto" data-s="'+esc(e.s)+'" data-it="'+esc(e.i||'')+'"><span class="ri-sec">'+esc(e.sec)+'</span><span class="ri-t">'+esc(e.t)+'</span><span class="ri-x">'+esc(e.x.slice(0,110))+'</span></button></li>';
  }).join('');
}
function toggleSearch(open){
  var p = $('#search-panel'), b = $('.search-btn'); open = open==null ? p.hidden : open;
  p.hidden = !open; b.setAttribute('aria-expanded', open);
  if (open){ var q = $('#q'); q.focus(); q.select(); }
}
$('#q').addEventListener('input', function(e){ doSearch(e.target.value); });
$('#q').addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); var f = $('#results .res-item'); if (f) f.click(); } });

/* ---------------- expand / filter ---------------- */
function toggleExp(b, force){
  var open = force==null ? b.getAttribute('aria-expanded') !== 'true' : force;
  b.setAttribute('aria-expanded', open); var p = document.getElementById(b.getAttribute('aria-controls')); if (p) p.hidden = !open;
}
function applyFilter(chip){
  $$('.chip', chip.parentNode).forEach(function(c){ c.setAttribute('aria-pressed', c===chip); });
  var v = chip.dataset.v;
  $$('#main [data-filter]').forEach(function(el){ el.hidden = !!v && el.dataset.filter !== v; });
}

function notEnough(msg){ stage('<p class="q-text">'+esc(msg||'هذا النشاط يحتاج إلى محتوى أكثر. أضيفي كلمات من وضع التحرير.')+'</p>'); foot('<button type="button" class="btn" data-act="pl-close">إغلاق</button>'); }

function runQuiz(qs){ PL.q = qs; PL.k = 0; PL.first = 0; PL.total = qs.length; nextQ(); }
function nextQ(){
  if (PL.k >= PL.q.length){ finish('أجبتِ عن '+ar(PL.first)+' من '+ar(PL.q.length)+' أسئلة من المحاولة الأولى. كل محاولة تعلّمك شيئًا جديدًا!'); return; }

var ALEF = /[اأإآء]/;
var CONFUSE = [['ب','ت','ث','ن','ي'],['ج','ح','خ'],['د','ذ'],['ر','ز'],['س','ش'],['ص','ض'],['ط','ظ'],['ع','غ'],['ف','ق'],['ك','ل']];
var ALPHA = 'بتثجحخدذرزسشصضطظعغفقكلمنهوي'.split('');
function firstL(w){ return w.trim().charAt(0); }
function distractors(L, items, n){
  var out = [], add = function(c){ if (c && c!==L && out.indexOf(c)<0 && !(ALEF.test(L) && ALEF.test(c))) out.push(c); };
  CONFUSE.forEach(function(g){ if (g.indexOf(L)>=0) shuffle(g).forEach(add); });
  out = out.slice(0, 2);
  shuffle(items).forEach(function(it){ add(firstL(it.w)); });
  shuffle(ALPHA).forEach(add);
  return out.slice(0, n);
}
var KINDS = {
  letters: function(){
    var items = pairs(PL.item.data); if (items.length < 4){ notEnough(); return; }
    var qs = shuffle(items).slice(0, 6).map(function(it, n){
      var L = firstL(it.w);
      if (n % 2 === 0){
        var opts = shuffle([L].concat(distractors(L, items, 3)));
        return {prompt:'<div class="q-pic" aria-hidden="true">'+esc(it.e)+'</div><p class="q-text">ما الحرف الأول في كلمة <span class="q-word">'+esc(it.w)+'</span>؟</p>',
          options: opts.map(function(l){ return {html:'<span class="opt-letter">'+esc(l)+'</span>', label:'حرف '+l, correct:l===L}; }),
          speak: it.w, after:'كلمة «'+it.w+'» تبدأ بحرف «'+L+'».'};
      }
      var used = [L], ds = [];
      shuffle(items).forEach(function(o){ var f = firstL(o.w); if (ds.length<2 && used.indexOf(f)<0 && !(ALEF.test(f)&&ALEF.test(L))){ used.push(f); ds.push(o); } });
      if (ds.length < 2) return null;
      var cards = shuffle([it].concat(ds));
      return {prompt:'<p class="q-text">أيّ صورة تبدأ بحرف <span class="q-letter">'+esc(L)+'</span>؟</p>',
        options: cards.map(function(c){ return {html:'<span class="pic" aria-hidden="true">'+esc(c.e)+'</span><span class="w">'+esc(c.w)+'</span>', label:c.w, correct:c===it}; }),
        speak:null, speakAfter: it.w, after:'«'+it.w+'» تبدأ بحرف «'+L+'».'};

  sentence: function(){
    var rows = String(PL.item.data||'').split('\n').map(function(l){ return l.split('|').map(function(x){ return x.trim(); }); }).filter(function(p){ return p.length >= 4; });
    if (rows.length < 2){ notEnough('أضيفي جملتين على الأقل من وضع التحرير.'); return; }
    var qs = shuffle(rows).slice(0, 6).map(function(p){
      var hasE = p.length >= 5, e = hasE ? p[0] : '', s = hasE ? p[1] : p[0], opts = hasE ? p.slice(2) : p.slice(1), right = opts[0];
      if (s.indexOf('___') < 0) s = s + ' ___';

        options: shuffle(opts.filter(Boolean)).map(function(w){ return {html:esc(w), label:w, correct:w===right}; }),

      var chart = '<div class="pv">'+digs.map(function(x, k){ var ps = n-1-k; return '<div class="pv-col'+(ps===pos?' hl':'')+'"><span class="pv-h">'+names[ps]+'</span><span class="pv-d">'+ar(x)+'</span></div>'; }).join('')+'</div>';
      if (q % 2 === 0){

    var qs = [];

    progress(0, 5);
    stage('<p class="q-text">شاهدي الأشكال وهي تضيء، ثم اضغطيها بالترتيب نفسه.</p><div class="pads">'+shapes.map(function(s, v){
      return '<button type="button" class="pad p'+v+'" data-act="pl-pad" data-v="'+v+'" disabled aria-label="'+s[0]+'"><svg viewBox="0 0 100 100" aria-hidden="true">'+s[1]+'</svg><span>'+s[0]+'</span></button>'; }).join('')+'</div>');
    PL.sq.names = shapes.map(function(s){ return s[0]; });
    fb(''); foot('<button type="button" class="btn" data-act="pl-seq-start">أنا مستعدة، ابدئي</button>');
  }
};
/* --- build words --- */
function buildRound(){
  if (PL.k >= PL.items.length){ finish('ركّبتِ '+ar(PL.items.length)+' كلمات، منها '+ar(PL.first)+' من المحاولة الأولى. أحسنتِ!'); return; }
  var it = PL.items[PL.k], letters = Array.from(it.w); PL.target = letters; PL.pos = 0; PL.miss = 0; PL.anyMiss = false;
  var order = shuffle(letters.map(function(c, x){ return {c:c, x:x}; }));
  if (letters.length > 1 && order.every(function(o, x){ return o.x === x; })) order.reverse();
  progress(PL.k, PL.items.length);
  stage('<div class="q-pic" aria-hidden="true">'+esc(it.e)+'</div><p class="q-text">رتّبي الحروف لتكوّني اسم الصورة. اضغطي الحرف الأول ثم الذي يليه.</p>'+
    '<div class="build-out"><span class="built" aria-live="polite"></span></div><div class="slots" style="justify-content:center;margin:-6px 0 16px">'+letters.map(function(){ return '<i></i>'; }).join('')+'</div>'+
    '<div class="q-opts">'+order.map(function(o){ return '<button type="button" class="opt tile-l" data-act="pl-tile" data-c="'+esc(o.c)+'" aria-label="حرف '+esc(o.c)+'"><span class="opt-letter">'+esc(o.c)+'</span></button>'; }).join('')+'</div>');
  fb(''); foot(speakBtn(it.w));
}
function buildTap(b){
  var c = b.dataset.c, want = PL.target[PL.pos];
  if (c === want){
    b.classList.add('used'); b.disabled = true; PL.pos++; PL.miss = 0;
    $$('#pl-stage .tile-l.hint').forEach(function(x){ x.classList.remove('hint'); });
    $('#pl-stage .built').textContent = PL.target.slice(0, PL.pos).join('');
    $$('#pl-stage .slots i').forEach(function(s, k){ s.classList.toggle('f', k < PL.pos); });
    if (PL.pos === PL.target.length){
      if (!PL.anyMiss) PL.first++;
      fb(pick(OK_MSG)+' الكلمة: «'+PL.target.join('')+'».', 'ok');
      foot(speakBtn(PL.target.join(''))+'<button type="button" class="btn" data-act="pl-build-next">'+(PL.k===PL.items.length-1?'إنهاء النشاط':'الكلمة التالية ←')+'</button>');
      var n = $('#pl-foot [data-act="pl-build-next"]'); if (n) n.focus();
    } else fb('صحيح! ما الحرف التالي؟', 'ok');
  } else {
    PL.miss++; PL.anyMiss = true; b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
    if (PL.miss >= 2){
      var h = $$('#pl-stage .tile-l').filter(function(x){ return !x.disabled && x.dataset.c === want; })[0];
      if (h) h.classList.add('hint'); fb('انظري إلى الحرف المضيء، فهو الحرف التالي.', 'no');
    } else fb('ليس هذا الحرف. انطقي الكلمة ببطء وحاولي مرة أخرى.', 'no');
  }
}
/* --- memory --- */
function memTap(b){
  var m = PL.mem; if (m.lock) return; var x = +b.dataset.x, c = m.cards[x];
  if (b.classList.contains('up') || b.classList.contains('done')) return;
  b.classList.add('up'); b.setAttribute('aria-label', c.label); m.open.push({b:b, c:c});
  if (m.open.length < 2) return;
  m.moves++; var a = m.open[0], d = m.open[1]; m.open = [];
  if (a.c.id === d.c.id){
    a.b.classList.add('done'); d.b.classList.add('done'); a.b.disabled = d.b.disabled = true; m.matched++;
    fb('أحسنتِ! وجدتِ الصورة وكلمتها.', 'ok');
    if (m.matched === m.pairs) later(function(){ finish('وجدتِ '+ar(m.pairs)+' أزواج في '+ar(m.moves)+' محاولة. ذاكرة رائعة!'); }, 700);
  } else {
    m.lock = true; fb('ليستا متطابقتين. تذكّري مكانهما وحاولي مرة أخرى.', 'no');
    later(function(){ [a, d].forEach(function(o){ o.b.classList.remove('up'); o.b.setAttribute('aria-label', 'بطاقة مقلوبة'); }); m.lock = false; }, 1100);
  }
}
/* --- sequence --- */
function pads(on){ $$('#pl-stage .pad').forEach(function(p){ p.disabled = !on; }); }
function flashPad(v, ms){ var p = $('#pl-stage .pad[data-v="'+v+'"]'); if (!p) return; p.classList.add('lit'); later(function(){ p.classList.remove('lit'); }, ms||420); }
function seqNewRound(){ var s = PL.sq; s.seq = Array.from({length:s.len}, function(){ return rand(0,3); }); s.miss = 0; seqPlay(); }
function seqPlay(){
  var s = PL.sq; s.input = []; s.playing = true; pads(false); foot(''); progress(s.done, 5);
  fb('انتبهي… شاهدي الترتيب ('+ar(s.len)+' أشكال)');
  s.seq.forEach(function(v, x){ later(function(){ flashPad(v, 480); }, 700 + x*750); });
  later(function(){ s.playing = false; pads(true); fb('الآن دورك: اضغطي الأشكال بالترتيب نفسه.'); var p = $('#pl-stage .pad'); if (p) p.focus(); }, 700 + s.seq.length*750);
}
function seqPress(v){
  var s = PL.sq; if (s.playing) return; flashPad(v, 220);
  if (v === s.seq[s.input.length]){
    s.input.push(v);
    if (s.input.length === s.seq.length){
      s.done++; pads(false); progress(s.done, 5);
      if (s.done >= 5){ later(function(){ finish('تذكّرتِ خمس سلاسل من الأشكال، وأطولها '+ar(s.len)+' أشكال. انتباه رائع!'); }, 500); return; }
      fb(pick(OK_MSG)+' السلسلة التالية أطول قليلًا.', 'ok'); s.len = Math.min(s.len+1, 8); later(seqNewRound, 1300);
    }
  } else {
    pads(false); s.miss++;
    if (s.miss >= 2){ s.len = Math.max(2, s.len-1); fb('لا بأس! سنجرّب سلسلة أقصر قليلًا.', 'no'); later(seqNewRound, 1500); }
    else { fb('لا بأس! لنشاهد الترتيب نفسه مرة أخرى.', 'no'); later(seqPlay, 1400); }
  }
}



/* ---------------- boot ---------------- */
window.addEventListener('hashchange', route);
function boot(){
  applyTheme(); renderTop(); renderFooter();
  var loaded = !SERVER ? Promise.resolve() :
    Promise.race([api('GET', '/api/content'), new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('timeout')); }, 6000); })])
      .then(function(r){ if (r && r.content){ data = normalize(r.content); META.publishedAt = r.publishedAt; } })
      .catch(function(){ /* الخادم غير متاح: تُعرض النسخة المضمّنة */ });
  loaded.then(function(){
    renderAll(); route(); if (!current) show(homeSec().id);
    if (!SERVER) return;
    api('GET', '/api/session').then(function(s){
      ADMIN = !!s.admin;
      if (ADMIN_PATH){ if (ADMIN) startAdmin(); else openLogin(); }
      else renderEditbar();
    }).catch(function(){ if (ADMIN_PATH) toast('تعذّر الاتصال بالخادم. لوحة الإدارة تعمل على الموقع المنشور فقط.', 'err'); });
  });
}
boot();
})();
</script>
